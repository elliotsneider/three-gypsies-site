<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Upcoming Events | Merciful TRVLR</title>

  <!-- Reliable CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f1e8;
      color: #252525;
      font-family: Georgia, "Times New Roman", serif;
    }

    .events-page {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 42px;
    }

    .page-header h1 {
      margin: 0 0 12px;
      font-size: clamp(2.3rem, 7vw, 4.5rem);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .page-header p {
      max-width: 650px;
      margin: 0 auto;
      color: #625e56;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    #events {
      display: grid;
      gap: 24px;
    }

    .event-card {
      display: grid;
      grid-template-columns: 145px 1fr;
      overflow: hidden;
      background: #fff;
      border: 1px solid #d8d1c4;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(30, 25, 20, 0.08);
    }

    .event-date {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 190px;
      padding: 24px 16px;
      background: #252525;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
    }

    .event-date .month {
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
    }

    .event-date .day {
      margin: 7px 0;
      font-size: 3.3rem;
      line-height: 1;
    }

    .event-date .year {
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
    }

    .event-content {
      padding: 28px 30px 30px;
    }

    .event-title {
      margin-bottom: 8px;
      color: #6b665d;
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .event-artist {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 4vw, 2.15rem);
      font-weight: normal;
    }

    .event-description {
      margin: 0 0 22px;
      color: #514d47;
      line-height: 1.65;
    }

    .status-message {
      padding: 40px 20px;
      color: #625e56;
      text-align: center;
      line-height: 1.6;
    }

    .error-message {
      color: #8a2d2d;
    }
.event-venue {
  font-size: 1.15rem;
  font-weight: bold;
  margin-bottom: 4px;
}

.event-city {
  color: #555;
  margin-bottom: 8px;
}

.event-time {
  font-family: Arial, sans-serif;
  font-size: 0.9rem;
  font-weight: bold;
  color: #777;
  margin-bottom: 18px;
  text-transform: uppercase;
}
    @media (max-width: 650px) {
      .events-page {
        padding-top: 42px;
      }

      .event-card {
        grid-template-columns: 1fr;
      }

      .event-date {
        min-height: auto;
        flex-direction: row;
        gap: 10px;
        padding: 16px;
      }

      .event-date .day {
        margin: 0;
        font-size: 1.6rem;
      }

      .event-content {
        padding: 24px;
      }
    }
.event-link {
    color: #252525;
    font-family: Arial, sans-serif;
    font-weight: bold;
    text-decoration: none;
}

.event-link:hover {
    text-decoration: underline;
}
  </style>
</head>

<body>
  <main class="events-page">
    <header class="page-header">
      <h1>Upcoming Performances</h1>

      <p>
        Concerts, book events, workshops, and appearances by Elliot Sneider and Merciful TRVLR.
      </p>
    </header>

    <section id="events" aria-live="polite">
      <div class="status-message">Loading upcoming events…</div>
    </section>
  </main>

<script>
  const sheetUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_-ESKAvK6rvOcWOpMbg_sWKpDBO4XswJF0a8EsV49TqD3oKlD81Jge57Ubmqz4CLuXajGvjkkp-mc/pub?gid=0&single=true&output=csv";

  const eventsContainer = document.getElementById("events");

  function escapeHtml(value = "") {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function parseLocalDate(dateValue) {
    if (!dateValue) return null;

    const value = String(dateValue).trim();

    /*
      Handles YYYY-MM-DD without shifting the date because of timezone.
    */
    const isoParts = value.split("-");

    if (isoParts.length === 3) {
      const year = Number(isoParts[0]);
      const month = Number(isoParts[1]) - 1;
      const day = Number(isoParts[2]);

      const date = new Date(year, month, day);

if (
  !Number.isNaN(date.getTime()) &&
  date.getFullYear() === year &&
  date.getMonth() === month &&
  date.getDate() === day
) {
  return date;
}
    }

    /*
      Also handles dates formatted by Google Sheets,
      such as 8/15/2026.
    */
    const fallbackDate = new Date(value);

    return Number.isNaN(fallbackDate.getTime())
      ? null
      : fallbackDate;
  }

  function getField(row, possibleNames) {
    for (const name of possibleNames) {
      if (
        row[name] !== undefined &&
        String(row[name]).trim() !== ""
      ) {
        return String(row[name]).trim();
      }
    }

    return "";
  }

  function formatEventTime(startTime, endTime) {
    if (startTime && endTime) {
      return `${startTime}–${endTime}`;
    }

    return startTime || endTime || "";
  }

  function createEventCard(event) {
    const month = event.date.toLocaleDateString("en-US", {
      month: "short"
    });

    const day = event.date.toLocaleDateString("en-US", {
      day: "numeric"
    });

    const year = event.date.toLocaleDateString("en-US", {
      year: "numeric"
    });

    const time = formatEventTime(
      event.startTime,
      event.endTime
    );

    return `
      <article class="event-card">
        <div class="event-date">
          <span class="month">${escapeHtml(month)}</span>
          <span class="day">${escapeHtml(day)}</span>
          <span class="year">${escapeHtml(year)}</span>
        </div>

        <div class="event-content">
          ${
            event.artist
              ? `
                <div class="event-artist">
                  ${escapeHtml(event.artist)}
                </div>
              `
              : ""
          }

          <h2 class="event-title">
            ${escapeHtml(event.title || "Upcoming Event")}
          </h2>

          ${
            event.venue
              ? `
                <div class="event-venue">
                  ${escapeHtml(event.venue)}
                </div>
              `
              : ""
          }

          ${
            event.city
              ? `
                <div class="event-city">
                  ${escapeHtml(event.city)}
                </div>
              `
              : ""
          }

          ${
            time
              ? `
                <div class="event-time">
                  ${escapeHtml(time)}
                </div>
              `
              : ""
          }

          ${
  event.description
    ? `
      <p class="event-description">
        ${escapeHtml(event.description)}
      </p>
    `
    : ""
}

${
  event.moreInfo
    ? `
      <p>
        <a
          class="event-link"
          href="${escapeHtml(event.moreInfo)}"
          target="_blank"
          rel="noopener">
          Learn More →
        </a>
      </p>
    `
    : ""
}

        </div>
      </article>
    `;
  }

  Papa.parse(sheetUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,

    complete(results) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const events = results.data
        .map(row => ({
          date: parseLocalDate(
            getField(row, ["Date", "date"])
          ),

          artist: getField(row, [
            "Artist",
            "artist"
          ]),

          title: getField(row, [
            "Event",
            "event"
          ]),

          venue: getField(row, [
            "Venue",
            "venue"
          ]),

          city: getField(row, [
            "City",
            "city"
          ]),

          startTime: getField(row, [
            "Start Time",
            "Start time",
            "start time"
          ]),

          endTime: getField(row, [
            "End Time",
            "End time",
            "end time"
          ]),

          description: getField(row, [
            "Description",
            "description"
          ]),
moreInfo: getField(row, [
  "More Info",
  "MoreInfo",
  "URL",
  "Link"
]),
        }))
        .filter(event => event.date && event.date >= today)
        .sort((a, b) => a.date - b.date);

      if (!events.length) {
        eventsContainer.innerHTML = `
          <div class="status-message">
            There are no upcoming events listed right now.
            Please check back soon.
          </div>
        `;

        return;
      }

      eventsContainer.innerHTML = events
        .map(createEventCard)
        .join("");
    },

    error(error) {
      console.error(
        "Could not load Google Sheet:",
        error
      );

      eventsContainer.innerHTML = `
        <div class="status-message error-message">
          The event calendar could not be loaded.
          Please refresh the page or check back later.
        </div>
      `;
    }
  });
</script>
</body>
</html>
